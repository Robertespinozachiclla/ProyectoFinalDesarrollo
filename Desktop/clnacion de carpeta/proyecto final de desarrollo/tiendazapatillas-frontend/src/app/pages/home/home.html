<!-- HEADER / NAVBAR -->
<header class="navbar">
  <div class="logo">
    <span class="logo-bold">GRUPO</span> <span class="logo-accent">ESPINOZA</span>
  </div>

  <nav class="nav-links">
    <a routerLink="/home" class="nav-item">Hombre</a>
    <a routerLink="/home" class="nav-item">Mujer</a>
    <a routerLink="/home" class="nav-item">Marca</a>
    <a routerLink="/home" class="nav-item">Categoría</a>
    <a routerLink="/home" class="nav-item badge-oferta">OFERTA</a>
  </nav>

  <div class="nav-icons">
    <button class="icon-btn" title="Buscar">
      <i class="bi bi-search"></i>
    </button>
    <button class="icon-btn" title="Favoritos">
      <i class="bi bi-heart"></i>
    </button>
    
    <!-- 👤 BOTÓN PERSONITA: Redirige a /login -->
    <button class="icon-btn" routerLink="/login" title="Iniciar Sesión">
      <i class="bi bi-person"></i>
    </button>

    <button class="icon-btn cart-btn" title="Carrito">
      <i class="bi bi-bag"></i>
    </button>
  </div>
</header>

<!-- MAIN CONTENT -->
<main class="container">
  <section class="section-title">
    <span class="indicator"></span>
    <h2>Productos Destacados</h2>
  </section>

  <!-- Estado de Carga -->
  <div *ngIf="loading" class="text-center my-5">
    <p>Cargando productos del catálogo...</p>
  </div>

  <!-- Lista Vacía -->
  <div *ngIf="!loading && destacados.length === 0" class="alert alert-info text-center my-4">
    No hay productos disponibles actualmente.
  </div>

  <!-- GRID DINÁMICO DE PRODUCTOS DESDE BASE DE DATOS -->
  <div class="products-grid" *ngIf="!loading && destacados.length > 0">
    
    <div class="product-card" *ngFor="let prod of destacados">
      <div class="image-container">
        <!-- Renderiza la imagen guardada en la carpeta public/ o un texto alternativo -->
        <img 
          *ngIf="prod.imagenUrl" 
          [src]="prod.imagenUrl" 
          [alt]="prod.nombre" 
          style="width: 100%; height: 100%; object-fit: cover;">
        
        <span *ngIf="!prod.imagenUrl" class="placeholder-text">
          {{ prod.nombre | uppercase }}
        </span>
      </div>
      
      <div class="card-body">
        <span class="tag">
          {{ prod.categoria?.nombre || 'Urbano' }}
        </span>
        <h3>{{ prod.nombre }}</h3>
        <p class="description">{{ prod.descripcion }}</p>
        
        <div class="card-footer">
          <span class="price">S/ {{ prod.precio }}</span>
          <button class="add-btn">
            Agregar <i class="bi bi-bag"></i>
          </button>
        </div>
      </div>
    </div>

  </div>
</main>
