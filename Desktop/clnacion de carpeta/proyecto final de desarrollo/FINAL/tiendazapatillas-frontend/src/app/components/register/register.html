<div class="register-container">
  <div class="register-card">
    
    <!-- Header / Logo -->
    <div class="register-header">
      <img src="logo.png" alt="Grupo Espinoza S.A." class="logo-img">
      <h2>Crear Cuenta</h2>
      <p class="subtitle">Ingresa tus datos para gestionar tus pedidos</p>
    </div>

    <!-- Mensajes de Alerta -->
    <div *ngIf="mensajeError" class="alert alert-danger">
      {{ mensajeError }}
    </div>
    
    <div *ngIf="mensajeExito" class="alert alert-success">
      {{ mensajeExito }}
    </div>

    <!-- Formulario Completo -->
    <form (ngSubmit)="onRegister()" #registerForm="ngForm" class="register-form">
      
      <!-- Fila 1: Nombre y Apellido -->
      <div class="form-row">
        <div class="form-group">
          <label for="nombre">Nombre</label>
          <input 
            type="text" 
            id="nombre" 
            name="nombre" 
            [(ngModel)]="nuevoUsuario.nombre"  
            required>
        </div>

        <div class="form-group">
          <label for="apellido">Apellido</label>
          <input 
            type="text" 
            id="apellido" 
            name="apellido" 
            [(ngModel)]="nuevoUsuario.apellido" 
            required>
        </div>
      </div>

      <!-- Fila 2: Correo y Teléfono -->
      <div class="form-row">
        <div class="form-group">
          <label for="correo">Correo Electrónico</label>
          <input 
            type="email" 
            id="correo" 
            name="correo" 
            [(ngModel)]="nuevoUsuario.correo" 
            required>
        </div>

        <div class="form-group">
          <label for="telefono">Teléfono / Celular</label>
          <input 
            type="tel" 
            id="telefono" 
            name="telefono" 
            [(ngModel)]="nuevoUsuario.telefono" 
            required>
        </div>
      </div>

      <!-- Fila 3: Dirección -->
      <div class="form-group">
        <label for="direccion">Dirección de Envío</label>
        <input 
          type="text" 
          id="direccion" 
          name="direccion" 
          [(ngModel)]="nuevoUsuario.direccion" 
          required>
      </div>

      <!-- Fila 4: Usuario y Contraseña -->
      <div class="form-row">
        <div class="form-group">
          <label for="username">Usuario</label>
          <input 
            type="text" 
            id="username" 
            name="username" 
            [(ngModel)]="nuevoUsuario.username" 
            required>
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input 
            type="password" 
            id="password" 
            name="password" 
            [(ngModel)]="nuevoUsuario.password" 
            required>
        </div>
      </div>

      <!-- Botón Principal -->
      <button 
        type="submit" 
        class="btn-primary" 
        [disabled]="registerForm.invalid || cargando">
        <span *ngIf="!cargando">Registrarme</span>
        <span *ngIf="cargando">Procesando...</span>
      </button>

    </form>

    <!-- Footer / Redirección a Login -->
    <div class="register-footer">
      <p>¿Ya tienes una cuenta?</p>
      <a routerLink="/login" class="btn-link">Iniciar Sesión</a>
    </div>

  </div>
</div>
