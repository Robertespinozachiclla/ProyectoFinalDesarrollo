spring.application.name=Proyectofinal
spring.datasource.url=jdbc:mysql://localhost:3306/tiendaZapatillas?serverTimezone=America/Lima
spring.datasource.username=root
spring.datasource.password=123456789
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jackson.time-zone=America/Lima
server.port=8080
# Aumentar el límite del cuerpo de la petición (POST/PUT) en Tomcat
server.tomcat.max-http-post-size=20MB
server.tomcat.max-swallow-size=20MB

# Límite para subida de archivos (Multipart)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB